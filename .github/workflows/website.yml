name: Website checks

on:
  push:
    paths: ['website/**', 'scripts/cloud-setup.sh', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', 'scripts/cloud-setup.sh', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: bash scripts/cloud-setup.sh
      - run: npm run lint
        working-directory: website
      - run: npm test
        working-directory: website
      - name: Isolated PostgreSQL integration
        run: npm run test:postgres
        working-directory: website
      - name: Chrome desktop and mobile paths
        run: npm run verify:visual
        working-directory: website
        env:
          VISUAL_CASES: agent-roomplan-desktop,agent-roomplan-mobile,agent-studio-desktop,agent-studio-mobile,agent-mask-desktop,agent-mask-mobile,buyer-experience-desktop,buyer-experience-mobile,buyer-private-mobile
      - name: Visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-visual-evidence
          path: website/verification/screenshots/
          if-no-files-found: ignore
          retention-days: 7
